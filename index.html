<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutorista | Tested tutors, fair fees, Lahore</title>
    <meta name="description" content="Tutorista matches students in Lahore with tested, verified one-to-one tutors for O and A Levels, Matric, FSc and entry tests, at fair fees." />
    <meta name="theme-color" content="#254d91" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tutorista" />
    <meta property="og:title" content="Tutorista | Tested tutors, fair fees" />
    <meta property="og:description" content="Every tutor tested and verified. O and A Levels, Matric, FSc and entry tests in Lahore, online or at home." />
    <meta property="og:image" content="https://tutorista.vercel.app/img/pk-uniform.webp" />
    <link rel="preload" href="/fonts/ranade-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('tutorista-lang')
        if (l === 'ur') {
          document.documentElement.lang = 'ur'; document.documentElement.dir = 'rtl'
          var f = document.createElement('link'); f.rel = 'preload'; f.as = 'font'; f.type = 'font/woff2'; f.crossOrigin = ''; f.href = '/fonts/gulzar-arabic.woff2'
          document.head.appendChild(f)
        }
        var p = JSON.parse(localStorage.getItem('tutorista-reading') || '{}')
        var d = { text: 'base', contrast: 'off', readable: 'off', links: 'off', motion: 'on' }
        for (var k in d) if (p[k] && p[k] !== d[k]) document.documentElement.dataset[k] = p[k]
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
